<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar using Flexbox</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap');

        * {
            margin: 0;
            padding: 0;
        }

        /* 
        header {
        border: 2px solid; 
            max-width: 1000px;
            width: 100%;
            margin: 0px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-wrap: wrap;
        } */

        nav {
            display: flex;
            justify-content: space-around;
            align-items: center;
            font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 14px;
            font-weight: 600;
            /* height: 80px; */
            /*background-color: white;
            padding: 0px 20px; */
        }

        .right ul {
            display: flex;
            gap: 0px 12px;
            justify-content: center;
            align-items: center;
        }

        .right ul li {
            list-style: none;

        }

        .chatimage {
            margin: 0px 10px;
        }



        .logo {
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>

<body>
    <header>
        <nav>

            <div class="logo">
                <img src="ultraedit logo.png" alt="ultraedit logo" width="120px">
            </div>
            <div class="right">
                <ul>

                    <li class="links">Products
                    <img src="arrow icon.png" alt="arrow icon" width="10px" height="10px"></li>
                    <li class="links">Pricing
                    <img src="arrow icon.png" alt="arrow icon" width="10px" height="10px"></li>
                    <li class="links">Resources
                    <img src="arrow icon.png" alt="arrow icon" width="10px" height="10px"></li>
                    <li class="links">About us
                    <img src="arrow icon.png" alt="arrow icon" width="10px" height="10px"></li>
                    <li class="chatimage">
                        <img src="chat logo2.jpg" alt="Chat logo" width="30px">
                    </li>
                </ul>
            </div>

        </nav>
    </header>
</body>

</html>
