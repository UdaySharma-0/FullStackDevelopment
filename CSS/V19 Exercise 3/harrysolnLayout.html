<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harry solution</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        nav {
            background-color: pink;
            height: 83px;
            position: sticky;
            top: 0;
        }

        main {
            background-color: black;
            color: white;
            padding: 34px;
        }

        .container {
            background-color: green;
            margin: 12px 34px;
            padding: 44px 20px;
            text-align: center;
        }

        .box1 {
            background-color: palevioletred;
            height: 70vh;
            width: 40%;
            display: inline-block;
            margin: 0 12px;
        }

        .box2 {
            background-color: blue;
            height: 70vh;
            width: 40%;
            display: inline-block;
            margin: 0 12px;
        }

        .text {
            padding: 34px;
            border: 2px solid white;
            margin: 0 28vw;
            font-size: 2em;
            text-align: center;
            justify-content: center;
            border-radius: 34px;
        }

        .orangebox {
            height: 44px;
            width: 44px;
            background: orange;
            position: fixed;
            bottom: 12px;
            right: 24px;
            border-radius: 50%;
        }

        footer {
            background-color: rgb(153, 111, 57);
            height: 80px;
        }
    </style>
</head>

<body>
    <header>
        <nav>

        </nav>
    </header>

    <main>
        <div class="container">
            <div class="box1"></div>
            <div class="box2"></div>
        </div>

        <div class="text">
            <p>
                Welcome to Sigma Web Development Express
            </p>
        </div>
        <div class="orangebox">

        </div>
    </main>

    <footer>

    </footer>
</body>

</html>
